<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 362 384" width="362" height="384" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect x="0" y="0" width="272" height="70" rx="6" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/><text x="12" y="22" font-size="14" font-weight="700" fill="#c4511a">5</text><text x="28" y="22" font-size="14" font-weight="700" fill="#1d2330">Views and venues</text><text x="28" y="41" font-size="12.5" fill="#5b6372">How does a person read it, cite it,</text><text x="28" y="58" font-size="12.5" fill="#5b6372">build on it?</text><text x="246" y="58" font-size="12" fill="#5b6372" text-anchor="end">emerging</text><circle cx="256" cy="54" r="5" fill="none" stroke="#5b6372" stroke-width="1.5"/><path d="M256 54V49A5 5 0 0 1 261 54Z" fill="#5b6372"/><rect x="0" y="78" width="272" height="70" rx="6" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/><text x="12" y="100" font-size="14" font-weight="700" fill="#c4511a">4</text><text x="28" y="100" font-size="14" font-weight="700" fill="#1d2330">Evidence</text><text x="28" y="119" font-size="12.5" fill="#5b6372">Why should anyone believe it,</text><text x="28" y="136" font-size="12.5" fill="#5b6372">and is it new?</text><text x="246" y="136" font-size="12" fill="#5b6372" text-anchor="end">uneven</text><circle cx="256" cy="132" r="5" fill="none" stroke="#5b6372" stroke-width="1.5"/><path d="M256 127A5 5 0 0 0 256 137Z" fill="#5b6372"/><rect x="0" y="156" width="272" height="70" rx="6" fill="#ffffff" stroke="#c4511a" stroke-width="2"/><text x="12" y="178" font-size="14" font-weight="700" fill="#c4511a">3</text><text x="28" y="178" font-size="14" font-weight="700" fill="#1d2330">Work</text><text x="28" y="197" font-size="12.5" fill="#5b6372">What has been tried, what failed,</text><text x="28" y="214" font-size="12.5" fill="#5b6372">and why?</text><text x="246" y="214" font-size="12" fill="#5b6372" text-anchor="end">young, fragmented</text><circle cx="256" cy="210" r="5" fill="none" stroke="#5b6372" stroke-width="1.5"/><path d="M256 205A5 5 0 0 0 256 215Z" fill="#5b6372"/><rect x="0" y="234" width="272" height="70" rx="6" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/><text x="12" y="256" font-size="14" font-weight="700" fill="#c4511a">2</text><text x="28" y="256" font-size="14" font-weight="700" fill="#1d2330">Statements and identity</text><text x="28" y="275" font-size="12.5" fill="#5b6372">What exactly is claimed? Is it the</text><text x="28" y="292" font-size="12.5" fill="#5b6372">same claim as that one?</text><text x="246" y="292" font-size="12" fill="#5b6372" text-anchor="end">partial</text><circle cx="256" cy="288" r="5" fill="none" stroke="#5b6372" stroke-width="1.5"/><path d="M256 283A5 5 0 0 0 256 293Z" fill="#5b6372"/><rect x="0" y="312" width="272" height="70" rx="6" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/><text x="12" y="334" font-size="14" font-weight="700" fill="#c4511a">1</text><text x="28" y="334" font-size="14" font-weight="700" fill="#1d2330">Sources and objects</text><text x="28" y="353" font-size="12.5" fill="#5b6372">What is known, what is asked,</text><text x="28" y="370" font-size="12.5" fill="#5b6372">where is it written?</text><text x="246" y="370" font-size="12" fill="#5b6372" text-anchor="end">well served</text><circle cx="256" cy="366" r="5" fill="none" stroke="#5b6372" stroke-width="1.5"/><circle cx="256" cy="366" r="5" fill="#5b6372"/><rect x="280" y="0" width="36" height="382" rx="6" fill="#ffffff" stroke="#e3e0d8"/><text transform="translate(303.0 191.0) rotate(-90)" text-anchor="middle" font-size="13" fill="#5b6372"><tspan font-weight="700" fill="#1d2330">Provenance</tspan> · who or what produced each piece</text><rect x="324" y="0" width="36" height="382" rx="6" fill="#ffffff" stroke="#e3e0d8"/><text transform="translate(347.0 191.0) rotate(-90)" text-anchor="middle" font-size="13" fill="#5b6372"><tspan font-weight="700" fill="#1d2330">Governance</tspan> · who decides, who pays</text></svg>
