<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 362 384" width="362" height="384" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'><rect x="0" y="0" width="272" height="70" rx="6" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/><text x="12" y="22" font-size="14" font-weight="700" fill="#c4511a">5</text><text x="28" y="22" font-size="14" font-weight="700" fill="#1d2330">Communication</text><text x="28" y="41" font-size="12.5" fill="#5b6372">How can others read, cite</text><text x="28" y="58" font-size="12.5" fill="#5b6372">and use the result?</text><rect x="0" y="78" width="272" height="70" rx="6" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/><text x="12" y="100" font-size="14" font-weight="700" fill="#c4511a">4</text><text x="28" y="100" font-size="14" font-weight="700" fill="#1d2330">Evidence</text><text x="28" y="119" font-size="12.5" fill="#5b6372">What has been checked,</text><text x="28" y="136" font-size="12.5" fill="#5b6372">on which claim, and by whom?</text><rect x="0" y="156" width="272" height="70" rx="6" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/><text x="12" y="178" font-size="14" font-weight="700" fill="#c4511a">3</text><text x="28" y="178" font-size="14" font-weight="700" fill="#1d2330">Research</text><text x="28" y="197" font-size="12.5" fill="#5b6372">What has been tried,</text><text x="28" y="214" font-size="12.5" fill="#5b6372">and how can work continue?</text><rect x="0" y="234" width="272" height="70" rx="6" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/><text x="12" y="256" font-size="14" font-weight="700" fill="#c4511a">2</text><text x="28" y="256" font-size="14" font-weight="700" fill="#1d2330">Statements</text><text x="28" y="275" font-size="12.5" fill="#5b6372">What is claimed, and how</text><text x="28" y="292" font-size="12.5" fill="#5b6372">does it connect to other claims?</text><rect x="0" y="312" width="272" height="70" rx="6" fill="#ffffff" stroke="#e3e0d8" stroke-width="1"/><text x="12" y="334" font-size="14" font-weight="700" fill="#c4511a">1</text><text x="28" y="334" font-size="14" font-weight="700" fill="#1d2330">Sources</text><text x="28" y="353" font-size="12.5" fill="#5b6372">Which problems, results</text><text x="28" y="370" font-size="12.5" fill="#5b6372">and examples can we draw on?</text><rect x="280" y="0" width="36" height="382" rx="6" fill="#ffffff" stroke="#e3e0d8"/><text transform="translate(303.0 191.0) rotate(-90)" text-anchor="middle" font-size="13" fill="#5b6372"><tspan font-weight="700" fill="#1d2330">Provenance</tspan> · who or what produced each piece</text><rect x="324" y="0" width="36" height="382" rx="6" fill="#ffffff" stroke="#e3e0d8"/><text transform="translate(347.0 191.0) rotate(-90)" text-anchor="middle" font-size="13" fill="#5b6372"><tspan font-weight="700" fill="#1d2330">Governance</tspan> · who decides, who pays</text></svg>
